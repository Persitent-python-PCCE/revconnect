spring.application.name=connection-service

server.port=8083

spring.datasource.url=${CONNECTION_DB_URL:jdbc:mysql://localhost:3306/revconnect_connection_db}
spring.datasource.username=${CONNECTION_DB_USERNAME:root}
spring.datasource.password=${CONNECTION_DB_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:revconnect-secret-key-must-be-at-least-32-characters-long}