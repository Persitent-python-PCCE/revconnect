apiVersion: v1
kind: Namespace
metadata: { name: revconnect }
---
apiVersion: v1
kind: Secret
metadata: { name: revconnect-secrets, namespace: revconnect }
type: Opaque
stringData:
  MYSQL_PASSWORD: CHANGE_ME_BEFORE_APPLYING
  JWT_SECRET: CHANGE_ME_TO_A_LONG_RANDOM_SECRET
---
apiVersion: v1
kind: ConfigMap
metadata: { name: revconnect-runtime, namespace: revconnect }
data:
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://service-discovery:8761/eureka/
  MYSQL_HOST: mysql
  MYSQL_USER: root
  REDIS_HOST: redis
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql, namespace: revconnect }
spec:
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env: [{ name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: revconnect-secrets, key: MYSQL_PASSWORD } } }]
          ports: [{ containerPort: 3306 }]
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: revconnect }
spec: { selector: { app: mysql }, ports: [{ port: 3306, targetPort: 3306 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: revconnect }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec: { containers: [{ name: redis, image: redis:7.4-alpine, ports: [{ containerPort: 6379 }] }] }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: revconnect }
spec: { selector: { app: redis }, ports: [{ port: 6379, targetPort: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: service-discovery, namespace: revconnect }
spec:
  replicas: 1
  selector: { matchLabels: { app: service-discovery } }
  template:
    metadata: { labels: { app: service-discovery } }
    spec: { containers: [{ name: service-discovery, image: YOUR_DOCKERHUB_USERNAME/revconnect-service-discovery:latest, ports: [{ containerPort: 8761 }] }] }
---
apiVersion: v1
kind: Service
metadata: { name: service-discovery, namespace: revconnect }
spec: { selector: { app: service-discovery }, ports: [{ port: 8761, targetPort: 8761 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: config-server, namespace: revconnect }
spec:
  replicas: 1
  selector: { matchLabels: { app: config-server } }
  template:
    metadata: { labels: { app: config-server } }
    spec:
      containers:
        - name: config-server
          image: YOUR_DOCKERHUB_USERNAME/revconnect-config-server:latest
          env: [{ name: EUREKA_URL, value: http://service-discovery:8761/eureka/ }, { name: CONFIG_REPO_PATH, value: file:/workspace/configrepo }]
          ports: [{ containerPort: 8888 }]
---
apiVersion: v1
kind: Service
metadata: { name: config-server, namespace: revconnect }
spec: { selector: { app: config-server }, ports: [{ port: 8888, targetPort: 8888 }] }
