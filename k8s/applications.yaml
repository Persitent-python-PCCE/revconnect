apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: revconnect }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: YOUR_DOCKERHUB_USERNAME/revconnect-api-gateway:latest
          env: &cloudEnv
            - { name: CONFIG_SERVER_URL, value: http://config-server:8888 }
            - { name: EUREKA_URL, value: http://service-discovery:8761/eureka/ }
            - { name: MYSQL_HOST, value: mysql }
            - { name: MYSQL_USER, value: root }
            - { name: REDIS_HOST, value: redis }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: revconnect-secrets, key: MYSQL_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: revconnect-secrets, key: JWT_SECRET } }
          ports: [{ containerPort: 9000 }]
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: revconnect }
spec: { type: LoadBalancer, selector: { app: api-gateway }, ports: [{ port: 9000, targetPort: 9000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: revconnect }
spec: { replicas: 2, selector: { matchLabels: { app: user-service } }, template: { metadata: { labels: { app: user-service } }, spec: { containers: [{ name: user-service, image: YOUR_DOCKERHUB_USERNAME/revconnect-user-service:latest, envFrom: [{ configMapRef: { name: revconnect-runtime } }, { secretRef: { name: revconnect-secrets } }], ports: [{ containerPort: 8081 }] }] } } }
---
apiVersion: v1
