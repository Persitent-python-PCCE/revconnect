spring.application.name=interaction-service

spring.datasource.url=${INTERACTION_DB_URL:jdbc:mysql://localhost:3306/interaction_db}
spring.datasource.username=${INTERACTION_DB_USERNAME:root}
spring.datasource.password=${INTERACTION_DB_PASSWORD:${DB_PASSWORD:}}

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${SERVER_PORT:8082}

revconnect.services.post-name=${POST_SERVICE_NAME:post-service}
revconnect.services.post-url=${POST_SERVICE_URL:http://localhost:8082}
revconnect.services.user-name=${USER_SERVICE_NAME:user-service}
revconnect.services.user-url=${USER_SERVICE_URL:http://localhost:8081}
revconnect.services.notification-name=${NOTIFICATION_SERVICE_NAME:notification-service}
revconnect.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
