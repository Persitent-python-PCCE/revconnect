spring.application.name=interaction-service

spring.datasource.url=${INTERACTION_DB_URL:jdbc:mysql://localhost:3306/interaction_db}
spring.datasource.username=${INTERACTION_DB_USERNAME:root}
spring.datasource.password=${INTERACTION_DB_PASSWORD:${DB_PASSWORD:}}

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${SERVER_PORT:8082}
