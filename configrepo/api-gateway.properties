server.port=9000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_ORIGIN:http://localhost:8080},http://localhost:5500
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.routes[0].id=interaction-service
spring.cloud.gateway.routes[0].uri=lb://interaction-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/posts/*/engagement,/api/posts/*/likes,/api/posts/*/comments,/api/posts/*/shares,/api/posts/*/reposts,/api/comments/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=interactionCircuit
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/interaction-service
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**,/api/user/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=userCircuit
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/user-service
