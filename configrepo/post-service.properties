server.port=8082
spring.datasource.url=${POST_DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/revconnect_post_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
revconnect.post.upload-dir=${POST_UPLOAD_DIR:uploads/posts}
