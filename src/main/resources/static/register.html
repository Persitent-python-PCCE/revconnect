<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RevConnect - Register</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">
    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow mt-5">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Create Account
                    </h2>

                    <p class="text-center text-muted">
                        Join RevConnect
                    </p>

                    <form id="registerForm">

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    placeholder="Enter username"
                                    required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Enter email"
                                    required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter password"
                                    required>
                        </div>

                        <!-- Account Type -->
                        <div class="mb-3">
                            <label for="accountType" class="form-label">
                                Account Type
                            </label>

                            <select
                                    class="form-select"
                                    id="accountType"
                                    required>

                                <option value="">
                                    Select account type
                                </option>

                                <option value="PERSONAL">
                                    Personal
                                </option>

                                <option value="CREATOR">
                                    Creator
                                </option>

                                <option value="BUSINESS">
                                    Business
                                </option>

                            </select>
                        </div>

                        <!-- Register Button -->
                        <button
                                type="submit"
                                class="btn btn-primary w-100">

                            Register

                        </button>

                    </form>

                    <!-- Message -->
                    <div
                            id="message"
                            class="mt-3">
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<script src="js/auth.js"></script>

</body>

</html>
