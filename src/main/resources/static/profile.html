<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>RevConnect - Profile</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="profile-page">

    <!-- TOP BAR -->

    <div class="profile-topbar">

        <a href="/index.html" class="back-btn">
            ←
        </a>

        <h3>Profile</h3>

        <button
                id="logoutBtn"
                class="logout-btn">
            Logout
        </button>

    </div>


    <!-- PROFILE CARD -->

    <div class="profile-container">

        <div class="profile-header">

            <!-- PROFILE IMAGE -->

            <div class="profile-avatar" id="profileAvatar">
                S
            </div>


            <!-- USER INFO -->

            <div class="profile-info">

                <div class="profile-name-row">

                    <h2 id="username">
                        Loading...
                    </h2>

                    <span
                            id="accountType"
                            class="account-badge">
                        Loading...
                    </span>

                </div>

                <p id="email">
                    Loading...
                </p>

                <p id="fullName">
                    Loading...
                </p>

                <p
                        id="bio"
                        class="profile-bio">
                    Loading...
                </p>
                
                <div id="relationshipActions" class="mt-3 d-flex gap-2" style="display: none !important;">
                </div>

            </div>

        </div>


        <!-- PROFILE STATS -->

        <div class="profile-stats">

            <div>
                <strong>0</strong>
                <span>Posts</span>
            </div>

            <div id="statFollowers" style="cursor: pointer;">
                <strong id="countFollowers">0</strong>
                <span>Followers</span>
            </div>

            <div id="statFollowing" style="cursor: pointer;">
                <strong id="countFollowing">0</strong>
                <span>Following</span>
            </div>

            <div id="statConnections" style="cursor: pointer;">
                <strong id="countConnections">0</strong>
                <span>Connections</span>
            </div>

            <div id="statPending" style="cursor: pointer; display: none;">
                <strong id="countPending">0</strong>
                <span>Requests</span>
            </div>

            <div id="statSent" style="cursor: pointer; display: none;">
                <strong id="countSent">0</strong>
                <span>Sent</span>
            </div>

        </div>


        <!-- EDIT BUTTON -->

        <button
                id="editProfileBtn"
                class="edit-profile-btn">

            Edit Profile

        </button>


        <!-- EDIT FORM -->

        <div
                id="editProfileForm"
                class="edit-profile-form"
                style="display: none;">

            <h4>Edit Profile</h4>

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                        type="text"
                        id="editFullName"
                        class="form-control">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Bio
                </label>

                <textarea
                        id="editBio"
                        class="form-control"
                        rows="3">
                </textarea>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Profile Picture
                </label>

                <input
                        type="text"
                        id="editProfilePicture"
                        class="form-control"
                        placeholder="profile.jpg">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Privacy
                </label>

                <select
                        id="editPrivacy"
                        class="form-select">

                    <option value="PUBLIC">
                        Public
                    </option>

                    <option value="PRIVATE">
                        Private
                    </option>

                </select>

            </div>


            <div class="edit-buttons">

                <button
                        id="cancelEditBtn"
                        class="cancel-btn">

                    Cancel

                </button>

                <button
                        id="saveProfileBtn"
                        class="save-btn">

                    Save Changes

                </button>

            </div>

            <div id="profileMessage"></div>

        </div>

    </div>

</div>


<!-- Generic List Modal -->
<div id="listModal" class="ig-modal-overlay" style="display: none;">
    <div class="ig-modal-dialog" style="max-width: 400px;">
        <div class="ig-modal-header">
            <span class="ig-modal-title" id="listModalTitle">List</span>
            <div class="ig-header-right">
                <button type="button" class="ig-header-icon-btn" id="listModalCloseBtn" title="Close">
                    <span style="font-size: 1.5rem;">&times;</span>
                </button>
            </div>
        </div>
        <div class="ig-modal-body" style="padding: 1rem; max-height: 400px; overflow-y: auto;" id="listModalBody">
        </div>
    </div>
</div>

<script src="/js/api/connectionApi.js"></script>
<script src="/js/profile.js"></script>

</body>

</html>
