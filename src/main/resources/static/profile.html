<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>RevConnect - Profile</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

    <!-- Profile page specific styling -->
    <style>

        /* =========================================
           PROFILE STATS
        ========================================= */

        .profile-stats {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 16px;
            margin: 10px 0 30px;
            align-items: stretch;
        }

        .profile-stats > div {
            min-width: 0;
            min-height: 72px;

            display: flex !important;
            flex-direction: column !important;
            align-items: center;
            justify-content: center;

            gap: 5px;

            padding: 10px 6px;

            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 12px;

            text-align: center;

            transition: var(--transition);
        }

        .profile-stats > div:hover {
            background: var(--surface);
            border-color: rgba(255, 90, 95, 0.35);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .profile-stats strong {
            display: block;
            width: 100%;

            margin: 0;

            font-size: 18px;
            line-height: 1.2;
            font-weight: 800;

            color: var(--text-main);
        }

        .profile-stats span {
            display: block;
            width: 100%;

            margin: 0;

            font-size: 11px;
            line-height: 1.2;
            font-weight: 600;

            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Hide stats when JavaScript sets them to none */
        .profile-stats > div[style*="display: none"] {
            display: none !important;
        }

        /* =========================================
           PROFILE EDIT BUTTON
        ========================================= */

        .edit-profile-btn {
            margin-top: 4px;
            margin-bottom: 0;
        }

        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 768px) {

            .profile-stats {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
            }

            .profile-stats > div {
                min-height: 68px;
            }

        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .profile-stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .profile-stats > div {
                min-height: 64px;
                padding: 8px 4px;
            }

            .profile-stats strong {
                font-size: 17px;
            }

            .profile-stats span {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>

<div class="profile-page">

    <!-- =========================================
         TOP BAR
    ========================================== -->

    <div class="profile-topbar">

        <a href="/index.html" class="back-btn">
            ←
        </a>

        <h3>Profile</h3>

        <button
                id="logoutBtn"
                class="logout-btn">
            Logout
        </button>

    </div>


    <!-- =========================================
         PROFILE CARD
    ========================================== -->

    <div class="profile-container">

        <div class="profile-header">

            <!-- PROFILE IMAGE -->

            <div
                    class="profile-avatar"
                    id="profileAvatar">
                S
            </div>


            <!-- USER INFO -->

            <div class="profile-info">

                <div class="profile-name-row">

                    <h2 id="username">
                        Loading...
                    </h2>

                    <span
                            id="accountType"
                            class="account-badge">
                        Loading...
                    </span>

                </div>

                <p id="email">
                    Loading...
                </p>

                <p id="fullName">
                    Loading...
                </p>

                <p
                        id="bio"
                        class="profile-bio">
                    Loading...
                </p>

                <div
                        id="relationshipActions"
                        class="mt-3 d-flex gap-2"
                        style="display: none !important;">
                </div>

            </div>

        </div>


        <!-- =========================================
             PROFILE STATS
        ========================================== -->

        <div class="profile-stats">

            <!-- Posts -->

            <div id="statPosts">

                <strong id="countPosts">
                    0
                </strong>

                <span>
                    Posts
                </span>

            </div>


            <!-- Followers -->

            <div
                    id="statFollowers"
                    style="cursor: pointer;">

                <strong id="countFollowers">
                    0
                </strong>

                <span>
                    Followers
                </span>

            </div>


            <!-- Following -->

            <div
                    id="statFollowing"
                    style="cursor: pointer;">

                <strong id="countFollowing">
                    0
                </strong>

                <span>
                    Following
                </span>

            </div>


            <!-- Connections -->

            <div
                    id="statConnections"
                    style="cursor: pointer;">

                <strong id="countConnections">
                    0
                </strong>

                <span>
                    Connections
                </span>

            </div>


            <!-- Received Requests -->

            <div
                    id="statPending"
                    style="cursor: pointer; display: none;">

                <strong id="countPending">
                    0
                </strong>

                <span>
                    Requests
                </span>

            </div>


            <!-- Sent Requests -->

            <div
                    id="statSent"
                    style="cursor: pointer; display: none;">

                <strong id="countSent">
                    0
                </strong>

                <span>
                    Sent
                </span>

            </div>

        </div>


        <!-- =========================================
             EDIT BUTTON
        ========================================== -->

        <button
                id="editProfileBtn"
                class="edit-profile-btn">

            Edit Profile

        </button>


        <!-- =========================================
             EDIT FORM
        ========================================== -->

        <div
                id="editProfileForm"
                class="edit-profile-form"
                style="display: none;">

            <h4>
                Edit Profile
            </h4>


            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                        type="text"
                        id="editFullName"
                        class="form-control">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Bio
                </label>

                <textarea
                        id="editBio"
                        class="form-control"
                        rows="3"></textarea>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Profile Picture
                </label>

                <input
                        type="text"
                        id="editProfilePicture"
                        class="form-control"
                        placeholder="profile.jpg">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Privacy
                </label>

                <select
                        id="editPrivacy"
                        class="form-select">

                    <option value="PUBLIC">
                        Public
                    </option>

                    <option value="PRIVATE">
                        Private
                    </option>

                </select>

            </div>


            <div class="edit-buttons">

                <button
                        id="cancelEditBtn"
                        class="cancel-btn">

                    Cancel

                </button>

                <button
                        id="saveProfileBtn"
                        class="save-btn">

                    Save Changes

                </button>

            </div>

            <div id="profileMessage"></div>

        </div>

    </div>

</div>


<!-- =========================================
     GENERIC LIST MODAL
========================================= -->

<div
        id="listModal"
        class="ig-modal-overlay"
        style="display: none;">

    <div
            class="ig-modal-dialog"
            style="max-width: 400px;">

        <div class="ig-modal-header">

            <span
                    class="ig-modal-title"
                    id="listModalTitle">
                List
            </span>

            <div class="ig-header-right">

                <button
                        type="button"
                        class="ig-header-icon-btn"
                        id="listModalCloseBtn"
                        title="Close">

                    <span style="font-size: 1.5rem;">
                        &times;
                    </span>

                </button>

            </div>

        </div>

        <div
                class="ig-modal-body"
                style="padding: 1rem; max-height: 400px; overflow-y: auto;"
                id="listModalBody">
        </div>

    </div>

</div>


<!-- =========================================
     SCRIPTS
========================================= -->

<script src="/js/api/connectionApi.js"></script>

<script src="/js/profile.js"></script>


</body>

</html>
